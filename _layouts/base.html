<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }} – Heura Studios</title>
<meta name="description" content="{{ page.description | escape }}">
<meta name="theme-color" content="#ffffff" data-light="#ffffff" data-dark="#000000">
<!-- Set before anything paints: the appearance (the one picked under Appearance at the foot of the page, else the
     system's), and ov-motion when things may move as they come into view (not with Reduce Motion). -->
<script>(function(d){var t,m,w=window;try{t=localStorage.getItem('ov-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=w.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';d.setAttribute('data-theme',t);d.classList.add('ov-js');if(w.matchMedia&&matchMedia('(prefers-reduced-motion: no-preference)').matches&&'IntersectionObserver'in w)d.classList.add('ov-motion');m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',m.getAttribute('data-'+t))})(document.documentElement)</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="Heura Studios">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="{{ page.description | escape }}">
<meta property="og:image" content="https://heurastudios.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Heura Studios. Specialize the base before you ship the agent. Beside it, a model’s pipeline in Heura Studios.">
{% if page.layout == 'post' %}<meta property="article:published_time" content="{{ page.date | date: '%Y-%m-%d' }}">
{% endif %}<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | escape }}">
<meta name="twitter:description" content="{{ page.description | escape }}">
<meta name="twitter:image" content="https://heurastudios.com/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/blog.css">
<script src="/site.js" defer></script>
</head>
<body>
<header class="ov-top">
  <div class="ov-wrap ov-top-row">
    <a class="ov-logo" href="/"><span class="ov-mark" aria-hidden="true"></span>Heura Studios</a>
    <nav class="ov-nav" aria-label="Sections">
      <a href="/#tools">Tools</a>
      <a href="/blog/"{% if page.current == 'blog' %} aria-current="page"{% endif %}>Blog</a>
    </nav>
    <a class="ov-btn ov-btn-primary ov-btn-small" href="/#request">Request access</a>
  </div>
</header>

<main class="bl-main">
  <div class="ov-wrap bl-wrap">
{{ content }}
  </div>
</main>

<footer class="ov-foot">
  <div class="ov-wrap">
    <div class="ov-foot-top">
      <div>
        <a class="ov-logo" href="/"><span class="ov-mark" aria-hidden="true"></span>Heura Studios</a>
      </div>
      <div class="ov-foot-cols">
        <nav aria-labelledby="ov-foot-product">
          <h2 id="ov-foot-product" class="ov-foot-title">Product</h2>
          <ul>
            <li><a href="/#tools">Tools</a></li>
            <li><a href="/#request">Request access</a></li>
            <li><a href="/blog/"{% if page.current == 'blog' %} aria-current="page"{% endif %}>Blog</a></li>
          </ul>
        </nav>
        <nav aria-labelledby="ov-foot-legal">
          <h2 id="ov-foot-legal" class="ov-foot-title">Legal</h2>
          <ul>
            <li><a href="/privacy/">Privacy Policy</a></li>
            <li><a href="/terms/">Terms of Service</a></li>
          </ul>
        </nav>
        <div>
          <h2 class="ov-foot-title">Contact</h2>
          <ul>
            <li><a href="mailto:ryantian@ostravanne.com,leoli@ostravanne.com,ethanwang@ostravanne.com">Email the founders</a></li>
          </ul>
        </div>
      </div>
    </div>
    <div class="ov-foot-bottom">
      <p>© 2026 Ostravanne</p>
      <div class="ov-appearance">
        <span id="ov-appearance-label">Appearance</span>
        <div class="ov-seg" role="radiogroup" aria-labelledby="ov-appearance-label">
          <label><input type="radio" name="ov-appearance" value="system" checked><span>System</span></label>
          <label><input type="radio" name="ov-appearance" value="light"><span>Light</span></label>
          <label><input type="radio" name="ov-appearance" value="dark"><span>Dark</span></label>
        </div>
      </div>
    </div>
  </div>
</footer>
</body>
</html>
