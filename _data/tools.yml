# The Studio's tools, on the Tools page (/tools/), in the same groups and order as the app's palette
# (web/studio/views/pipeline.js there).
# owner: true  -> dark tile + "Owner only" (screen readers)
# icon: the inner SVG of a 20x20 line icon
# clip: its recording, img/tools/<clip>.mp4/.webm/.webp (and -dark.*), made with _tools/record-tools.py
# shows: what the recording shows, for screen readers (the video's name)

- id: signal
  name: Signal
  tools:
    - name: Grounding
      clip: grounding
      shows: "a file of gift card rules is added, read and live"
      takes: "documents"
      gives: "context, retrieved at answer time"
      icon: '<path d="M10 2.5v7.5M3.5 10h13M6 13.25h8M8.5 16.5h3"/>'
    - name: Policies
      clip: policies
      shows: "a rule is added: never promise a delivery date"
      takes: "rules, in plain words"
      gives: "a constraint on every answer"
      icon: '<path d="M5.5 3.5h-2.5v13h2.5M8 6.5h9M8 10h9M8 13.5h6"/>'
    - name: Demonstrations
      clip: demonstrations
      shows: "a question is added with the answer it should get"
      takes: "input and output pairs"
      gives: "training rows, three per new pair"
      icon: '<rect x="2.5" y="6.5" width="6" height="7"/><rect x="11.5" y="6.5" width="6" height="7" fill="currentColor"/><path d="M8.5 10h3"/>'
    - name: Corrections
      clip: corrections
      shows: "a wrong answer is fixed in the Playground, then waits in Corrections for the next run"
      takes: "an answer from the Playground, fixed or marked good"
      gives: "a demonstration"
      icon: '<path d="M3 6h5M3 14h5M5.5 11.5v5M11 6h6M11 14h6"/>'
    - name: Interviews
      clip: interviews
      shows: "an answer about what the shop sells is saved as two facts, and the next question comes"
      takes: "an operator’s answers to the model’s questions"
      gives: "facts and rules it answers from"
      icon: '<path d="M3 5.25a2.75 2.75 0 1 1 3.75 2.55c-.6.25-1 .75-1 1.4v.8"/><circle cx="5.75" cy="12.9" r=".95" fill="currentColor" stroke="none"/><path d="M11 5h6.5M11 8.5h4.5M9 13.5h8.5M9 17h5.5"/>'
- id: train
  name: Training
  tools:
    - name: Eval set
      clip: eval-set
      shows: "an eval run: 3 of its 8 prompts pass"
      takes: "prompts, each with what a passing answer must contain"
      gives: "a pass rate, before and after every run"
      owner: true
      icon: '<path d="M2.5 5l2 2 3-3.5M2.5 10.5l2 2 3-3.5M3 14.5l3.5 3.5M6.5 14.5L3 18M10 5.5h7M10 11h7M10 16.25h7"/>'
    - name: Base model
      clip: base-model
      shows: "the engines it can answer with: Heura Arche on this server, or OpenAI"
      takes: "Heura Arche (2B), or a model you bring"
      gives: "the model that answers"
      owner: true
      icon: '<path d="M10 3l7 3.5-7 3.5-7-3.5zM3 10.25l7 3.5 7-3.5M3 13.75l7 3.5 7-3.5"/>'
    - name: Fine-tune
      clip: fine-tune
      shows: "a run trains 13 new lessons, and checkpoint 1 goes live"
      takes: "new demonstrations and corrections, plus a replay mix"
      gives: "a LoRA checkpoint on Heura Arche"
      icon: '<path d="M3 2.5v14.5h14.5"/><path d="M5.5 4.5c1.5 6.5 4.5 9.5 11 10"/>'
    - name: OpenAI fine-tune
      clip: openai-fine-tune
      shows: "OpenAI fine-tunes a GPT model on the lessons, sped up, and it goes into use"
      takes: "the same rows"
      gives: "a fine-tuned OpenAI model"
      owner: true
      icon: '<path d="M3 5.5v11.5h11.5"/><path d="M5.5 7.5c1.2 4.6 3.6 6.8 8.5 7.2"/><path d="M12.5 2.5h5v5M17.5 2.5l-5.5 5.5"/>'
- id: release
  name: Release
  tools:
    - name: Promotion gate
      clip: promotion-gate
      shows: "its rule, and the checkpoints: v1 promoted on a tie"
      takes: "a run’s checkpoint"
      gives: "the live checkpoint, unless it scores lower"
      owner: true
      icon: '<path d="M4.5 3.5l11 4.75-11 4.75M4.5 16.5h11"/>'
    - name: Serving
      clip: serving
      shows: "the embed gets a new greeting, and its live preview answers a question"
      takes: "the live checkpoint"
      gives: "an OpenAI-compatible endpoint, an embed, an export"
      icon: '<circle cx="6" cy="10" r="3.25"/><path d="M9.25 10h8.25M14.5 7l3 3-3 3"/>'
    - name: Playground
      clip: playground
      shows: "a question about gift cards is answered from Grounding, and marked good"
      takes: "your questions"
      gives: "Serving’s answers, and corrections from the ones you mark"
      icon: '<path d="M2.5 3.5h10v5.5h-6.5l-2 2v-2h-1.5z"/><path d="M17.5 9.5h-8v5.5h4.5l2 2v-2h1.5z"/>'
